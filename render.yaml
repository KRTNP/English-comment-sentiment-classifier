services:
  - type: web
    name: sentiment-english-api
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir -r requirements-api.txt && pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu torch==2.5.1+cpu
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: MODEL_ID
        value: Kittigon/sentiment-english-3class-seed52
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: HF_TOKEN
        sync: false
      - key: MODEL_DIR
        value: outputs/seed_stability_stage2_best/seed_52
      - key: MAX_LENGTH
        value: "256"
